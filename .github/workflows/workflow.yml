name: Docker Image CI

on:
  push:
    branches: [ review-3 ]
  pull_request:
    branches: [ review-3 ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: write
    steps:
      # 1. Checkout репозитория
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Определяем имя репозитория
      - name: Set REPO env
        run: echo "REPO=${OWNER,,}" >>${GITHUB_ENV}
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Debug REPO
        run: echo "repo=${REPO}"

      # 3. Настройка QEMU (для multi-arch, если понадобится)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # 4. Настройка Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 5. Логин в GHCR
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 6. Backend
      - name: Build & Push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ env.REPO }}/film-react-nest-backend:latest
            ghcr.io/${{ env.REPO }}/film-react-nest-backend:${{ github.sha }}

      # 7. Frontend
      - name: Build & Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ env.REPO }}/film-react-nest-frontend:latest
            ghcr.io/${{ env.REPO }}/film-react-nest-frontend:${{ github.sha }}

      # 8. Nginx / Server
      - name: Build & Push Server
        uses: docker/build-push-action@v6
        with:
          context: ./nginx
          push: true
          tags: |
            ghcr.io/${{ env.REPO }}/film-react-nest-server:latest
            ghcr.io/${{ env.REPO }}/film-react-nest-server:${{ github.sha }}
